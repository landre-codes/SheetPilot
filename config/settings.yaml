# Configuracao global do SheetPilot
database:
  path: data/pilot.db
  migrations_dir: migrations

scan:
  extensoes:
    - .xlsx
    - .xlsb
    - .xlsm
    - .csv
    - .parquet
  excluir_padroes: [ "~$", ".tmp" ]
  # Detectar múltiplas tabelas na mesma sheet (separadas por linhas em branco)
  detectar_tabelas: true
  # Mínimo de linhas (incluindo cabeçalho) para considerar um grupo como tabela
  min_linhas_tabela: 3

transform:
  # Regex para deteccao de colunas-data (dd/mm/aaaa prioritario)
  # Aceita: dd/mm/aaaa, dd-mm-aaaa, mm/aaaa, mm-aaaa, aaaa-mm-dd, aaaa-mm, aaaa
  coluna_data_regex: "^(?:\\d{2}[/-]\\d{2}[/-]\\d{4}|\\d{2}[/-]\\d{4}|\\d{4}[/-]\\d{2}(?:[/-]\\d{2})?|\\d{4})$"
  # Validacao por amostras: % minimo de valores que devem ser datas
  sample_validation_threshold: 0.7
  sample_min_values: 5
  batch_size: 1000

mapeamentos:
# Example mapping for a specific schema_hash
# - schema_hash: "abc123..."
#   tabela_destino: "vendas"
#   coluna_cliente: "Cliente"
#   coluna_data_regex: "^\\d{4}$"
